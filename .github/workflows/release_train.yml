# The OpenJD release train for this repository. The train runs in AWS and holds no GitHub credential: this
# workflow asks it what to do (start a train for a new upstream release, push a bot/* branch, open its PR,
# notice a merge, tag a release) and does the GitHub writes with this job's GITHUB_TOKEN. All the logic
# and its checks live in the reusable workflow; this caller only sets the triggers and forwards the
# mode variable and the role secret.
#
# Turned on per repository with the variable RELEASE_TRAIN_ENABLED=true; RELEASE_TRAIN_MODE names the
# train's mode and the secret RELEASE_TRAIN_ROLE the AWS role that may invoke the train's gateway.
#
# A PR the train opens has its CI held until a maintainer approves the run; review and merge it as usual.
# The merge (a push to the default branch) runs this workflow, which tells the train.
name: Release train

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    # The default branch: a merged bot PR is reported right away instead of on the next schedule.
    branches: [rt-ci]

# One run at a time per repository; a run that finds nothing to do takes a few seconds.
concurrency:
  group: release-train
  cancel-in-progress: false

permissions: {}

jobs:
  train:
    if: ${{ vars.RELEASE_TRAIN_ENABLED == 'true' }}
    # Our own reusable workflow, referenced by branch like every aws-deadline/.github workflow (the org's
    # zizmor policy allows that ref pin for aws-deadline/*); this fork test points at a fork branch.
    uses: seant-aws/.github/.github/workflows/reusable_release_train.yml@release-train # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write # push bot/* branches; create tags and releases
      pull-requests: write # open and update the train's PRs and their labels
      actions: write # dispatch the repo's own release workflow (reserved)
      id-token: write # OIDC tokens for the AWS role and the gateway
    with:
      mode: ${{ vars.RELEASE_TRAIN_MODE }}
      tooling_repository: seant-aws/.github
      tooling_ref: release-train
    secrets:
      role_arn: ${{ secrets.RELEASE_TRAIN_ROLE }}
